services:
  - type: web
    name: poec-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /health
    disk:
      name: proof-storage
      mountPath: /app/backend/proof_bundles
      sizeGB: 1
    envVars:
      - key: POEC_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: poec-db
          property: connectionString
      - key: ANCHOR_CONTRACT_ADDRESS
        sync: false
      - key: ETHEREUM_NODE_URL
        value: https://rpc.sepolia.org
      - key: DEPLOYER_PRIVATE_KEY
        sync: false

databases:
  - name: poec-db
    databaseName: poec
    user: poec_user
    plan: free # or starter
